name: pi-ember-agentic-os

# Dedicated, offline Pi-Ember container for the guided Agentic OS installer.
# The running container has no host volumes or bind mounts.

x-runtime-hardening: &runtime-hardening
  image: pi-ember-agentic-os:local
  build:
    context: ../..
    dockerfile: docker/pi-ember-agentic-os/Dockerfile
    args:
      PI_EMBER_BASE_IMAGE: ${PI_EMBER_AGENTIC_OS_BASE_IMAGE:-pi-codex-container:pi-ember-dev}
  user: "10001:10001"
  # The inherited image entrypoint dispatches every command to `pi`.  This
  # sandbox must also invoke Python installer and verification commands.
  entrypoint: []
  init: true
  # The guided installer writes only to this container's writable layer.
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  mem_limit: 768m
  cpus: 1.0
  network_mode: none
  environment:
    HOME: /home/pi
    PI_CODING_AGENT_DIR: /home/pi/.pi/agent
    PI_OFFLINE: "1"
    PI_TELEMETRY: "0"
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  stdin_open: true
  tty: true

services:
  pi-runtime:
    <<: *runtime-hardening
    container_name: pi-ember-agentic-os
    working_dir: /home/pi
    command: ["sleep", "infinity"]

